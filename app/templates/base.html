<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css"/>
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ app_name }}</a>
    <nav>
      <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Дашборд</a>
      <a href="/scans/new" class="{% if page == 'new' %}active{% endif %}">Сканировать</a>
      <a href="/scans" class="{% if page == 'scans' %}active{% endif %}">История</a>
      <a href="/harbor" class="{% if page == 'harbor' %}active{% endif %}">Harbor</a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Настройки</a>
      <a href="/docs" target="_blank">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>{{ app_name }} · сканирование образов · Syft + Grype</span>
  </footer>
</body>
</html>
